[pytest]
testpaths = tests
pythonpath = .
# The live tier is opt-out by default: a bare `pytest` must never spend API
# quota or touch Neon. A command-line -m (e.g. `pytest -m live`) overrides this.
addopts = -ra --strict-markers -m "not live"
markers =
    retrieval: retrieval precision evals
    grading: relevance-grading evals
    citations: citation-verification evals
    pipeline: end-to-end agent pipeline evals
    live: hits the real Gemini API and Neon database; needs GEMINI_API_KEY + DATABASE_URL (deselected in CI)
